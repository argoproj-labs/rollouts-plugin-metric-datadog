<title id="architecture-title">Argo Rollouts Datadog metric plugin architecture</title>
<desc id="architecture-desc">The Argo Rollouts controller reads the metric from an AnalysisTemplate and calls the plugin for each measurement. The plugin resolves Datadog keys from a Kubernetes Secret, checks a shared cache, queries the metrics, monitor, or SLO source through a rate limiter to the Datadog API, and returns the measurement to the controller.</desc>
